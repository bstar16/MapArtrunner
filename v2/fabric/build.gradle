plugins {
    id 'fabric-loom' version '1.16.1'
}

base {
    archivesName = rootProject.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    implementation project(':core')
    include project(':core')

    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'mapart-test'
        // Explicit opt-in agrees to the Minecraft EULA; task discovery never accepts it.
        eula = providers.gradleProperty('mapartTestEula').map { it.toBoolean() }.getOrElse(false)
    }
}

loom {
    runs.configureEach {
        runDir "build/run/${name}"
    }
}

tasks.named('test', Test) {
    workingDir = layout.buildDirectory.dir('run/unitTest').get().asFile
    doFirst {
        workingDir.mkdirs()
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}
